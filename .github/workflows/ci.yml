name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # install.sh, install.ps1 and install.cmd ship for all three, so the suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install from the lockfile
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
