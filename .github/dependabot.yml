version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # mcp 2.x renames FastMCP, which src/cchwc/mcp_server.py uses; moving to it is a code change, not a bump.
    ignore:
      - dependency-name: mcp
        versions: ['>=2']
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
